# Merge/adapt this into a project .codex/config.toml or your Codex config.
# Canonical main-thread default; escalation is orchestrator-controlled and stepwise:
# medium → high → xhigh → max.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true
# V1 defense in depth for exactly one delegation level. Current Multi-Agent V2 ignores this field,
# so Skill/worker policy remains the authoritative one-level rule.
max_depth = 1
# Deliberately omit max_concurrent_threads_per_session/max_threads here: current Multi-Agent V2
# can reject the legacy/global thread-limit setting. Let the active backend use its own default unless
# the user intentionally configures that backend-specific limit and verifies it in their runtime.
